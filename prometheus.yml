global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 如果需要监控你之前配置的 Kafka 和 Redis 的 Exporter，可以把下面的注释解开
  - job_name: 'kafka-exporter'
    static_configs:
      - targets: ['kafka-exporter:9308']
  
  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']